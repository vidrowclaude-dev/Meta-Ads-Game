<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auction Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulation-first training game for Meta Ads media buyers in India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ==========================================================================
   AUCTION ROOM — styles
   Layout concept: a media buyer's desk. Sticky HUD on top, one working
   surface below (map, module runner, mock Ads Manager), calm review panels.
   Dark-first palette (ink navy + marigold), light theme mirrored.
   ========================================================================== */
:root {
  --bg: #0D1120;
  --bg-2: #141A2D;
  --bg-3: #1B2239;
  --bg-4: #232B47;
  --line: #2B3354;
  --line-2: #3A4570;
  --fg: #E9EBF5;
  --fg-2: #AAB1CB;
  --fg-3: #737C9E;
  --accent: #FFB627;          /* marigold */
  --accent-ink: #1B1300;
  --accent-soft: rgba(255, 182, 39, 0.14);
  --info: #8EA6FF;            /* periwinkle */
  --info-soft: rgba(142, 166, 255, 0.14);
  --best: #3DDC97;
  --ok: #6CB4FF;
  --risky: #FF9A55;
  --wrong: #FF5C7A;
  --best-soft: rgba(61, 220, 151, 0.13);
  --ok-soft: rgba(108, 180, 255, 0.13);
  --risky-soft: rgba(255, 154, 85, 0.14);
  --wrong-soft: rgba(255, 92, 122, 0.14);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "IBM Plex Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-s: 6px;
  --r-m: 10px;
  --r-l: 16px;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.4rem;
  --step-3: 1.85rem;
  --step-4: 2.5rem;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F2F4F9; --bg-2: #FFFFFF; --bg-3: #E9EDF5; --bg-4: #DDE3EF;
    --line: #D3DAE8; --line-2: #B9C2D8;
    --fg: #111628; --fg-2: #46506F; --fg-3: #737D9C;
    --accent: #B86E00; --accent-ink: #FFFFFF; --accent-soft: rgba(184, 110, 0, 0.12);
    --info: #3653CF; --info-soft: rgba(54, 83, 207, 0.10);
    --best: #0E8A55; --ok: #2367B8; --risky: #B8520E; --wrong: #C42848;
    --best-soft: rgba(14, 138, 85, 0.10); --ok-soft: rgba(35, 103, 184, 0.10);
    --risky-soft: rgba(184, 82, 14, 0.10); --wrong-soft: rgba(196, 40, 72, 0.10);
    --shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F2F4F9; --bg-2: #FFFFFF; --bg-3: #E9EDF5; --bg-4: #DDE3EF;
  --line: #D3DAE8; --line-2: #B9C2D8;
  --fg: #111628; --fg-2: #46506F; --fg-3: #737D9C;
  --accent: #B86E00; --accent-ink: #FFFFFF; --accent-soft: rgba(184, 110, 0, 0.12);
  --info: #3653CF; --info-soft: rgba(54, 83, 207, 0.10);
  --best: #0E8A55; --ok: #2367B8; --risky: #B8520E; --wrong: #C42848;
  --best-soft: rgba(14, 138, 85, 0.10); --ok-soft: rgba(35, 103, 184, 0.10);
  --risky-soft: rgba(184, 82, 14, 0.10); --wrong-soft: rgba(196, 40, 72, 0.10);
  --shadow: 0 10px 30px rgba(20, 30, 60, 0.12);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: var(--step-4); font-weight: 800; }
h2 { font-size: var(--step-3); font-weight: 700; }
h3 { font-size: var(--step-2); font-weight: 700; }
h4 { font-size: var(--step-1); font-weight: 650; }
p { margin: 0; }
a { color: var(--info); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.small { font-size: var(--step--1); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-l { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 16px; border-radius: var(--r-m); border: 1px solid var(--line-2);
  background: var(--bg-3); color: var(--fg); cursor: pointer; font-weight: 600;
  min-height: 40px; transition: background .15s, border-color .15s, transform .1s;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--bg-4); border-color: var(--fg-3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--bg-3); color: var(--fg); }
.btn.small { padding: 5px 10px; min-height: 32px; font-size: var(--step--1); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.kbd { font-family: var(--font-mono); font-size: 0.72rem; padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; color: var(--fg-2); }

/* ---------- App shell ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
.hud-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; background: none; border: 0; cursor: pointer; padding: 4px 0; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 0.8rem; }
.hud-stats { display: flex; align-items: center; gap: 14px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.hud-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hud-stat .eyebrow { font-size: 0.66rem; }
.hud-val { font-weight: 600; font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 6px; background: var(--bg-4); border-radius: 99px; overflow: hidden; width: 110px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.meter.trust > i { background: var(--best); }
.meter.trust.mid > i { background: var(--risky); }
.meter.trust.low > i { background: var(--wrong); }
.hud-nav { display: flex; gap: 4px; flex-wrap: wrap; }
.hud-nav .btn { min-height: 34px; padding: 5px 10px; font-size: var(--step--1); }
.hud-nav .btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.focus-chip { max-width: 260px; }
@media (max-width: 760px) {
  .hud-stats { order: 3; flex-basis: 100%; gap: 12px; }
  .meter { width: 80px; }
  .focus-chip { display: none; }
}

main.view {
  flex: 1 1 auto; width: 100%; max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}

/* ---------- Surfaces ---------- */
.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px; min-width: 0; }
.panel.tight { padding: 14px; }
.panel.raised { box-shadow: var(--shadow); }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
  font-size: 0.78rem; font-weight: 600; background: var(--bg-3); color: var(--fg-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.tag-sim { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-3); border: 1px dashed var(--line-2); border-radius: 4px; padding: 1px 6px; }

/* Ratings (icon + text, never colour alone) */
.rating { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 6px; font-weight: 700; font-size: 0.78rem; white-space: nowrap; }
.rating .ic { font-family: var(--font-mono); }
.rating.best { background: var(--best-soft); color: var(--best); }
.rating.ok { background: var(--ok-soft); color: var(--ok); }
.rating.risky { background: var(--risky-soft); color: var(--risky); }
.rating.wrong { background: var(--wrong-soft); color: var(--wrong); }
.edge-best { border-left: 3px solid var(--best); }
.edge-ok { border-left: 3px solid var(--ok); }
.edge-risky { border-left: 3px solid var(--risky); }
.edge-wrong { border-left: 3px solid var(--wrong); }

/* ---------- Home / map ---------- */
.home-head { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
@media (max-width: 860px) { .home-head { grid-template-columns: 1fr; } }
.hero-title { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -0.025em; }
.hero-title em { font-style: normal; color: var(--accent); }
.ticker { font-family: var(--font-mono); font-size: 0.78rem; color: var(--fg-3); display: flex; gap: 14px; flex-wrap: wrap; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.mod-card {
  position: relative; display: flex; flex-direction: column; gap: 10px; text-align: left;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; cursor: pointer;
  transition: border-color .15s, transform .15s; min-width: 0;
}
.mod-card:hover:not(.locked) { border-color: var(--accent); }
.mod-card.locked { cursor: default; opacity: .62; }
.mod-card.done { border-color: color-mix(in srgb, var(--best) 50%, var(--line)); }
.mod-num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--fg-3); }
.mod-card h4 { font-size: 1.05rem; }
.stage-dots { display: flex; gap: 5px; }
.stage-dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--bg-4); }
.stage-dots i.on { background: var(--best); }
.comp-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.comp-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bg-4); border: 1px solid var(--line-2); display: inline-block; }
.comp-dot.dev { background: var(--risky); border-color: var(--risky); }
.comp-dot.proven { background: var(--best); border-color: var(--best); }

/* ---------- Module runner ---------- */
.runner-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.step {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--bg-2); color: var(--fg-3); font-size: var(--step--1); font-weight: 600; cursor: pointer;
}
.step .n { font-family: var(--font-mono); font-size: 0.72rem; }
.step.done { color: var(--best); border-color: color-mix(in srgb, var(--best) 40%, var(--line)); }
.step.current { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.step[disabled] { cursor: not-allowed; opacity: .5; }

.brief-card { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 820px) { .brief-card { grid-template-columns: 1fr; } }
.brief-visual { background: var(--bg-3); border-radius: var(--r-l); padding: 14px; overflow-x: auto; }
.brief-visual svg { width: 100%; height: auto; display: block; min-width: 300px; }
.why-line { border-left: 3px solid var(--accent); padding: 6px 12px; background: var(--accent-soft); border-radius: 0 var(--r-s) var(--r-s) 0; }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.term { background: var(--bg-3); border-radius: var(--r-m); padding: 10px 12px; font-size: var(--step--1); }
.term b { display: block; font-family: var(--font-display); font-size: 0.95rem; margin-bottom: 2px; }
details.more > summary { cursor: pointer; color: var(--info); font-weight: 600; font-size: var(--step--1); }
details.more[open] > summary { margin-bottom: 10px; }

/* ---------- Drill ---------- */
.drill-wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.drill-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.timer { flex: 1 1 200px; height: 8px; background: var(--bg-4); border-radius: 99px; overflow: hidden; }
.timer > i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
.timer.warn > i { background: var(--wrong); }
.combo { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--accent); min-width: 70px; text-align: right; }
.combo.pop { animation: pop .3s ease; }
@keyframes pop { 50% { transform: scale(1.25); } }
.q-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.q-prompt { font-size: var(--step-1); font-weight: 600; line-height: 1.4; }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; border-radius: var(--r-m);
  border: 1px solid var(--line-2); background: var(--bg-3); cursor: pointer; line-height: 1.4; width: 100%;
}
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .key { font-family: var(--font-mono); font-size: 0.75rem; color: var(--fg-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 6px; margin-top: 2px; flex: none; }
.opt[disabled] { cursor: default; }
.opt.picked { border-width: 2px; }
.opt.best { border-color: var(--best); background: var(--best-soft); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.risky { border-color: var(--risky); background: var(--risky-soft); }
.opt.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.opt .r-tag { margin-left: auto; flex: none; }
.feedback { border-radius: var(--r-m); padding: 12px 14px; background: var(--bg-3); display: flex; flex-direction: column; gap: 6px; }
.tip { font-size: var(--step--1); color: var(--fg-2); }
.tip b { color: var(--info); }

/* swipe */
.swipe-area { position: relative; display: grid; place-items: center; min-height: 230px; touch-action: pan-y; }
.swipe-card {
  width: min(100%, 440px); min-height: 170px; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r-l);
  padding: 22px; display: grid; place-items: center; text-align: center; font-size: var(--step-1); font-weight: 600;
  cursor: grab; user-select: none; transition: transform .2s; box-shadow: var(--shadow);
}
.swipe-card.dragging { transition: none; cursor: grabbing; }
.swipe-labels { display: flex; justify-content: space-between; gap: 10px; }
.swipe-labels .btn { flex: 1 1 0; white-space: normal; }

/* order */
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-3); border: 1px solid var(--line-2);
  border-radius: var(--r-m); cursor: grab; user-select: none;
}
.order-item.dragging { opacity: .5; }
.order-item.over { border-color: var(--accent); }
.order-item .pos { font-family: var(--font-mono); color: var(--fg-3); width: 22px; }
.order-item .mv { margin-left: auto; display: flex; gap: 4px; }
.order-item .mv button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--bg-2); cursor: pointer; }
.order-item.correct { border-color: var(--best); }
.order-item.incorrect { border-color: var(--wrong); }

/* match */
.match-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.match-col { display: flex; flex-direction: column; gap: 6px; }
.match-btn {
  text-align: left; padding: 9px 11px; border-radius: var(--r-m); border: 1px solid var(--line-2); background: var(--bg-3);
  cursor: pointer; font-size: var(--step--1); line-height: 1.35; min-height: 44px;
}
.match-btn.sel { border-color: var(--accent); background: var(--accent-soft); }
.match-btn.paired { border-style: dashed; color: var(--fg-2); }
.match-btn .pair-n { font-family: var(--font-mono); color: var(--accent); margin-right: 6px; }
.match-btn.right { border-color: var(--best); border-style: solid; }
.match-btn.bad { border-color: var(--wrong); border-style: solid; }

/* number */
.num-input { display: flex; gap: 8px; align-items: center; }
.num-input input { width: 180px; padding: 10px 12px; border-radius: var(--r-m); border: 1px solid var(--line-2); background: var(--bg-3); font-family: var(--font-mono); font-size: 1.1rem; }

/* ---------- Forms (sandbox, ads manager) ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-weight: 600; font-size: var(--step--1); color: var(--fg); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field .hint { font-size: 0.8rem; color: var(--fg-3); }
.input, select.input, textarea.input {
  width: 100%; padding: 9px 11px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--bg-3);
  min-height: 40px;
}
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.radio-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.tile {
  display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: var(--r-m); border: 1px solid var(--line-2);
  background: var(--bg-3); cursor: pointer; text-align: left; font-size: var(--step--1);
}
.tile b { font-size: 0.9rem; }
.tile span { color: var(--fg-3); font-size: 0.78rem; line-height: 1.35; }
.tile[aria-checked="true"], .tile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: var(--step--1); }
.toggle input { appearance: none; -webkit-appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--bg-4); border: 1px solid var(--line-2); position: relative; cursor: pointer; flex: none; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-2); transition: transform .15s; }
.toggle input:checked { background: var(--accent); border-color: var(--accent); }
.toggle input:checked::after { transform: translateX(16px); background: var(--accent-ink); }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: var(--step--1); padding: 6px 8px; border-radius: var(--r-s); background: var(--bg-3); cursor: pointer; }
.check input { accent-color: var(--accent); margin-top: 3px; }
.chips-input { display: flex; flex-wrap: wrap; gap: 6px; }

      xp: 0, trust: 70,
      session: { n: 1, last: Date.now(), activeMs: 0, nudgedAt: 0 },
      modules: {},          // id -> { stages:{brief,drill,sandbox,scenario,debrief}, scores:{}, done, completedAt, decisions:[] }
      comps: {},            // competencyId -> [{ctx, ok, t}]
      review: [],           // { id, due, stage }
      notes: {},            // moduleId -> [3 lines]
      badges: {},           // id -> timestamp
      missions: {},         // id -> timestamp
      lab: { runs: 0, bestPct: 0 },
      stats: { drillAnswered: 0, drillCorrect: 0, bestCombo: 0, decisions: 0 }
    };
  }

  let state = null;
  let saveTimer = null;
  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { Store.save(state); bus.emit('saved'); }, 150);
  }

  /** Boot: load or create state, roll the session counter if the player has been away 30+ min. */
  function init() {
    const loaded = Store.load();
    state = Object.assign(freshState(), loaded || {});
    state.session = Object.assign(freshState().session, state.session || {});
    state.stats = Object.assign(freshState().stats, state.stats || {});
    state.settings = Object.assign(freshState().settings, state.settings || {});
    if (loaded && Date.now() - (state.session.last || 0) > 30 * 60 * 1000) state.session.n += 1;
    state.session.last = Date.now();
    persist();
    return state;
  }

  /* ---------- Ratings & scoring ---------- */
  const RATINGS = {
    B: { key: 'B', label: 'Best', pts: 10, icon: '✓✓', cls: 'best', trust: 3, ok: true },
    A: { key: 'A', label: 'Acceptable', pts: 6, icon: '✓', cls: 'ok', trust: 1, ok: true },
    R: { key: 'R', label: 'Risky', pts: 2, icon: '!', cls: 'risky', trust: -8, ok: false },
    W: { key: 'W', label: 'Wrong', pts: 0, icon: '✗', cls: 'wrong', trust: -15, ok: false }
  };

  /* ---------- XP & ranks ---------- */
  const RANKS = [
    { name: 'Intern', xp: 0 },
    { name: 'Junior Media Buyer', xp: 600 },
    { name: 'Media Buyer', xp: 1800 },
    { name: 'Senior Media Buyer', xp: 3600 },
    { name: 'Performance Lead', xp: 6000 },
    { name: 'Growth Manager', xp: 9000 },
    { name: 'Head of Growth', xp: 13000 }
  ];
  function rankFor(xp) {
    let idx = 0;
    RANKS.forEach((r, i) => { if (xp >= r.xp) idx = i; });
    const cur = RANKS[idx], next = RANKS[idx + 1] || null;
    const pct = next ? (xp - cur.xp) / (next.xp - cur.xp) : 1;
    return { idx, name: cur.name, next, pct: clamp(pct, 0, 1) };
  }
  function addXP(n, why) {
    n = Math.round(n);
    if (!n) return;
    const before = rankFor(state.xp).idx;
    state.xp += n;
    const after = rankFor(state.xp);
    bus.emit('xp', { n, why });
    if (after.idx > before) bus.emit('rankup', after);
    persist();
  }

  /* ---------- Client trust ---------- */
  function changeTrust(delta) {
    state.trust = clamp(state.trust + delta, 0, 100);
    bus.emit('trust', state.trust);
    persist();
    return state.trust;
  }
  function setTrust(v) { state.trust = clamp(v, 0, 100); bus.emit('trust', state.trust); persist(); }

  /* ---------- Competency tracker ----------
     A competency is Proven after 3 correct applications in at least 2
     different contexts (drill, sandbox, scenario). Review counts as drill,
     the Lab counts as sandbox. */
  const CTX_MAP = { drill: 'drill', review: 'drill', sandbox: 'sandbox', lab: 'sandbox', scenario: 'scenario', capstone: 'scenario', exam: 'drill' };
  function logComp(ids, ctx, ok) {
    if (!ids || !ids.length) return;
    const c = CTX_MAP[ctx] || ctx;
    ids.forEach(id => {
      const before = compStatus(id);
      (state.comps[id] = state.comps[id] || []).push({ ctx: c, ok: !!ok, t: Date.now() });
      if (state.comps[id].length > 60) state.comps[id] = state.comps[id].slice(-60);
      const after = compStatus(id);
      if (before !== 'proven' && after === 'proven') {
        addXP(50, 'Competency proven');
        bus.emit('proven', id);
      }
    });
    persist();
  }
  function compStatus(id) {
    const log = state.comps[id] || [];
    const oks = log.filter(e => e.ok);
    const ctxs = new Set(oks.map(e => e.ctx));
    const recent = log.slice(-10);
    const acc = recent.filter(e => e.ok).length / recent.length;
    // Spec rule (3 correct, 2+ contexts) plus recent accuracy, so lucky streaks don't count.
    if (oks.length >= 3 && ctxs.size >= 2 && acc >= 0.6) return 'proven';
    if (log.length) return 'developing';
    return 'none';
  }
  function compDetail(id) {
    const log = state.comps[id] || [];
    const oks = log.filter(e => e.ok);
    return { attempts: log.length, correct: oks.length, contexts: Array.from(new Set(oks.map(e => e.ctx))) };
  }

  /* ---------- Spaced repetition ----------
     A missed item resurfaces after 1 session, then 3, then 7. */
  const INTERVALS = [1, 3, 7];
  function queueMiss(itemId) {
    const ex = state.review.find(r => r.id === itemId);
    if (ex) { ex.stage = 0; ex.due = state.session.n + INTERVALS[0]; }
    else state.review.push({ id: itemId, stage: 0, due: state.session.n + INTERVALS[0] });
    persist();
  }
  function reviewResult(itemId, ok) {
    const ex = state.review.find(r => r.id === itemId);
    if (!ex) return;
    if (ok) {
      ex.stage += 1;
      if (ex.stage >= INTERVALS.length) state.review = state.review.filter(r => r.id !== itemId);
      else ex.due = state.session.n + INTERVALS[ex.stage];
    } else { ex.stage = 0; ex.due = state.session.n + INTERVALS[0]; }
    persist();
  }
  function dueReviews() { return state.review.filter(r => r.due <= state.session.n); }

  /* ---------- Badges ---------- */
  function award(id) {
    if (state.badges[id]) return false;
    state.badges[id] = Date.now();
    const def = (MAG.BADGES || []).find(b => b.id === id);
    bus.emit('badge', def || { id, name: id });
    addXP(40, 'Badge');
    persist();
    return true;
  }

  /* ---------- Module progress ---------- */
  function mod(id) {
    if (!state.modules[id]) state.modules[id] = { stages: {}, scores: {}, decisions: [], done: false };
    return state.modules[id];
  }
  function completeStage(modId, stage, score) {
    const m = mod(modId);
    m.stages[stage] = true;
    if (score != null) {
      const prev = m.scores[stage];
      m.scores[stage] = prev == null ? score : Math.max(prev, score);
      m.scores[stage + '_last'] = score;
    }
    persist();
    bus.emit('progress', { modId, stage });
  }
  /** Record a rated decision (scenario/sandbox) for the debrief's "you vs expert" table. */
  function logDecision(modId, entry) {
    const m = mod(modId);
    m.decisions = (m.decisions || []).filter(d => d.key !== entry.key);
    m.decisions.push(entry);
    state.stats.decisions += 1;
    persist();
  }

  /* ---------- Session activity (break nudges) ---------- */
  let lastInteract = Date.now();
  function touch() { lastInteract = Date.now(); }
  function tickActivity(ms) {
    if (Date.now() - lastInteract < 120000 && !document.hidden) {
      state.session.activeMs += ms;
      state.session.last = Date.now();
      const mins = state.session.activeMs / 60000;
      if (mins - (state.session.nudgedAt || 0) >= 45) { state.session.nudgedAt = mins; bus.emit('nudge'); }
      persist();
    }
  }

  /* ---------- Import / export ---------- */
  function exportJSON() { return JSON.stringify({ game: 'auction-room', exported: new Date().toISOString(), state }, null, 2); }
  function importJSON(text) {
    const obj = JSON.parse(text);
    const s = obj && obj.state ? obj.state : obj;
    if (!s || typeof s !== 'object' || s.v !== 1) throw new Error('This file is not an Auction Room progress file.');
    state = Object.assign(freshState(), s);
    Store.save(state);
    bus.emit('reset');
  }
  function reset() { Store.clear(); state = freshState(); Store.save(state); bus.emit('reset'); }

  /* ---------- Formatting helpers (Indian numbering) ---------- */
  function inr(n, dec) {
    if (n == null || !isFinite(n)) return '—';
    const d = dec == null ? (Math.abs(n) < 100 ? 2 : 0) : dec;
    return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function num(n, dec) {
    if (n == null || !isFinite(n)) return '—';
    return Number(n).toLocaleString('en-IN', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
  }
  function pct(n, dec) { if (n == null || !isFinite(n)) return '—'; return (n * 100).toFixed(dec == null ? 2 : dec) + '%'; }

  MAG.core = {
    rng, shuffle, clamp, hashStr, bus, Store, RATINGS, RANKS, rankFor,
    init, get state() { return state; }, persist,
    addXP, changeTrust, setTrust,
    logComp, compStatus, compDetail,
    queueMiss, reviewResult, dueReviews,
    award, mod, completeStage, logDecision,
    touch, tickActivity, exportJSON, importJSON, reset,
    fmt: { inr, num, pct }
  };
})(window.MAG);
</script>
<script data-src="src/engine/sim.js">
/* ==========================================================================
   SIMULATOR — all numbers are SIMULATED / ILLUSTRATIVE.
   Per ad, per day:
     totalValue  = bid × estimatedActionRate + adQuality
     CPM         = base × season × audiencePressure × placement × (pool / totalValue)^0.7
     impressions = spend / CPM × 1000;  reach = A(1 − e^(−I/A));  freq = I / reach
     CTR         = baseCTR × hook × fit × fatigue(freq, daysLive)
     LPV         = clicks × pageLoad
     CVR         = baseCVR × offer × landingPage × temperature
     TRUE conv   = LPV × CVR       (backend truth)
     REPORTED    = TRUE × trackingFactor + view/engage-through extras
   Learning: until ~50 optimisation events within 7 days of the last
   significant edit, outcomes get ±25% volatility. Edits reset learning.
   Seeded noise (±10%) makes every run reproducible from its seed.
   ========================================================================== */
(function (MAG) {
  'use strict';
  const { rng, clamp, hashStr } = MAG.core;

  const BASE = {
    cpm: 140,             // ₹ illustrative (see VOLATILE_FACTS.illustrativeCpm)
    ctr: 0.011,
    cvr: 0.028,
    pool: 1.25,           // average competitor totalValue
    refAudience: 20000000,
    fx: 84                // illustrative USD→INR, used for currency-mismatch errors only
  };
  const TEMP = { cold: { cvr: 1, cpm: 1, inc: 0.92 }, warm: { cvr: 1.8, cpm: 1.25, inc: 0.62 }, hot: { cvr: 3.0, cpm: 1.55, inc: 0.38 } };
  // What the ad set is told to optimise for changes who Meta finds.
  const OPT = {
    purchase: { cpm: 1.0, ctr: 1.0, cvr: 1.0, evMult: 1 },
    lead: { cpm: 0.95, ctr: 1.0, cvr: 1.0, evMult: 1 },
    atc: { cpm: 0.92, ctr: 1.05, cvr: 0.75, evMult: 3.2 },
    lpv: { cpm: 0.78, ctr: 1.2, cvr: 0.5, evMult: 0 },
    clicks: { cpm: 0.7, ctr: 1.4, cvr: 0.32, evMult: 0 },
    reach: { cpm: 0.55, ctr: 0.7, cvr: 0.35, evMult: 0 }
  };
  const PLACEMENT = { advantage: 1.0, manual_broad: 1.06, feeds_only: 1.32, stories_only: 1.18, an_heavy: 0.62 };

  /* ---- Breakdown dimensions: weights and per-segment efficiency ---- */
  const DIMS = {
    age: { keys: ['18–24', '25–34', '35–44', '45–54', '55+'], w: [0.2, 0.36, 0.23, 0.13, 0.08], cpm: [0.85, 1, 1.08, 1.05, 0.95], ctr: [1.1, 1, 0.95, 0.9, 0.85], cvr: [0.6, 1.1, 1.2, 1.0, 0.8], rep: [1, 1, 1, 1, 1] },
    gender: { keys: ['Female', 'Male', 'Unknown'], w: [0.46, 0.52, 0.02], cpm: [1.05, 0.96, 0.9], ctr: [1.05, 0.96, 0.9], cvr: [1.1, 0.92, 0.8], rep: [1, 1, 1] },
    placement: { keys: ['Feeds', 'Reels', 'Stories', 'Explore & search', 'Audience Network'], w: [0.38, 0.3, 0.18, 0.05, 0.09], cpm: [1.15, 0.85, 0.9, 1.0, 0.45], ctr: [1.0, 1.08, 0.82, 0.9, 1.35], cvr: [1.12, 0.96, 0.9, 1.0, 0.3], rep: [1, 1, 1, 1, 1] },
    region: { keys: ['Karnataka', 'Maharashtra', 'Delhi NCR', 'Tamil Nadu', 'Telangana', 'Uttar Pradesh', 'Rest of India'], w: [0.17, 0.2, 0.15, 0.1, 0.09, 0.11, 0.18], cpm: [1.15, 1.18, 1.2, 1.0, 1.05, 0.8, 0.85], ctr: [1, 1, 1, 1.02, 1, 1.08, 1.05], cvr: [1.12, 1.1, 1.08, 1.0, 1.02, 0.78, 0.82], rep: [1, 1, 1, 1, 1, 1, 1] },
    device: { keys: ['Android', 'iOS', 'Desktop'], w: [0.78, 0.17, 0.05], cpm: [0.92, 1.45, 1.1], ctr: [1.0, 0.95, 0.8], cvr: [0.92, 1.35, 1.2], rep: [1.0, 0.72, 1.0] }
  };

  /** How much REPORTED differs from TRUE because of tracking setup. */
  function trackingFactor(t) {
    t = t || {};
    let f = 1;
    if (t.pixel === false && !t.capi) return 0;          // nothing installed
    if (!t.capi) f *= 0.8;                                // browser-only: blockers, iOS, consent
    if (t.capi && t.pixel === false) f *= 0.93;           // server-only: fine but loses some browser context
    const emq = t.emq == null ? 6.5 : t.emq;
    f *= 0.82 + 0.18 * clamp(emq / 8, 0, 1);              // weak matching → fewer attributed events
    if (t.capi && t.pixel !== false && t.dedup === false) f *= 1.85;   // double counting
    if (t.firesOnLoad) f *= 2.3;                          // purchase fires on checkout load, not on thank-you
    return f;
  }

  /** Per-ad-set deterministic segment weights (consistent across days). */
  function segWeights(dim, seedKey, tilt) {
    const d = DIMS[dim]; const r = rng(seedKey + ':' + dim);
    const w = d.w.map(x => x * (0.85 + 0.3 * r()));
    if (tilt && tilt[dim]) tilt[dim].forEach((m, i) => { w[i] *= m; });
    const s = w.reduce((a, b) => a + b, 0);
    return w.map(x => x / s);
  }

  function seasonAt(cfg, day) {
    if (typeof cfg.season === 'function') return cfg.season(day);
    if (Array.isArray(cfg.season)) return cfg.season[day] || 1;
    return 1;
  }
  /** Stochastic rounding keeps small counts honest and deterministic for a seed. */
  function sround(x, r) { const f = Math.floor(x); return f + (r() < (x - f) ? 1 : 0); }

  /**
   * Run the simulation.
   * cfg: { seed, days, startDate, season, aov, codShare, rtoRate, attribution:{view,engage},
   *        tracking:{pixel,capi,dedup,emq,firesOnLoad,currency,value,utm},
   *        adsets:[{ id, name, campaignId, campaignName, dailyBudget, audienceSize, temperature,
   *                  bidMult, bidCap, placements, optimisation, edits:[days], budgetByDay:fn|[],
   *                  ads:[{ id, name, hook, fit, quality, offer, lp, pageLoad, hold, launchDay, pausedFrom }] }] }
   */
  function run(cfg) {
    const days = cfg.days || 14;
    const r = rng(cfg.seed != null ? cfg.seed : 'default');
    const aov = cfg.aov || 1200;
    const track = cfg.tracking || {};
    const tf = trackingFactor(track);
    const attr = Object.assign({ view: true, engage: true }, cfg.attribution || {});
    const valueMult = track.value === false ? 0 : (track.currency === 'USD' ? BASE.fx : 1);
    const rows = [];
    const asState = {};

    (cfg.adsets || []).forEach(as => {
      asState[as.id] = { cumImps: 0, learnStart: 0, events: [], exited: false, adImps: {} };
    });

    for (let day = 0; day < days; day++) {
      const season = seasonAt(cfg, day);
      (cfg.adsets || []).forEach(as => {
        const st = asState[as.id];
        const opt = OPT[as.optimisation || 'purchase'] || OPT.purchase;
        const temp = TEMP[as.temperature || 'cold'];
        const A = Math.max(5000, as.audienceSize || 5000000);
        const pressure = clamp(Math.pow(BASE.refAudience / A, 0.12), 0.85, 1.95);
        const placeMult = PLACEMENT[as.placements || 'advantage'] || 1;
        let budget = as.dailyBudget || 0;
        if (Array.isArray(as.budgetByDay) && as.budgetByDay[day] != null) budget = as.budgetByDay[day];
        if (typeof as.budgetByDay === 'function') budget = as.budgetByDay(day, budget);
        // Significant edit → learning resets.
        if ((as.edits || []).indexOf(day) >= 0) { st.learnStart = day; st.events = []; st.exited = false; }
        // Learning status before today's delivery.
        const sinceEdit = day - st.learnStart;
        const evCount = st.events.filter(e => e.day > day - 8).reduce((a, e) => a + e.n, 0);
        let status = 'Active';
        if (!st.exited) status = sinceEdit >= 7 ? 'Learning limited' : 'Learning';
        if (opt.evMult === 0 && !st.exited) status = sinceEdit >= 3 ? 'Active' : 'Learning';
        const volatile = status !== 'Active';

        const reach0 = A * (1 - Math.exp(-st.cumImps / A));
        const freq0 = reach0 > 0 ? st.cumImps / reach0 : 1;
        const ads = (as.ads || []).filter(ad => (ad.launchDay || 0) <= day && (ad.pausedFrom == null || ad.pausedFrom > day));
        if (!ads.length || budget <= 0) return;

        // Auction value for each ad decides how the ad set's spend is shared.
        const evals = ads.map(ad => {
          const daysLive = day - (ad.launchDay || 0);
          const adFreq = Math.max(freq0, 1);
          const fatigue = 1 / (1 + Math.max(0, adFreq - 2) * 0.22 + daysLive * 0.006);
          const ear = (ad.hook || 1) * (ad.fit || 1) * fatigue;
          const tv = (as.bidMult || 1) * ear + 0.5 * (ad.quality == null ? 0.6 : ad.quality);
          return { ad, fatigue, ear, tv, daysLive };
        });
        const wsum = evals.reduce((a, e) => a + Math.pow(e.tv, 2.2), 0);
        let dayEvents = 0;
        evals.forEach(e => {
          const ad = e.ad;
          const share = Math.pow(e.tv, 2.2) / wsum;
          let spend = budget * share;
          const noise = () => 1 + (r() * 2 - 1) * 0.1;
          const vol = volatile ? 1 + (r() * 2 - 1) * 0.25 : 1;
          const pool = BASE.pool * Math.sqrt(season);
          let cpm = BASE.cpm * season * pressure * placeMult * opt.cpm * temp.cpm * Math.pow(pool / e.tv, 0.7) * noise();
          let winRate = 1;
          if (as.bidCap) {   // bid cap: under-delivers when the cap is below what the auction needs
            const needed = cpm / 1000 / Math.max(0.0001, BASE.ctr * (ad.hook || 1) * BASE.cvr);
            winRate = clamp(Math.pow(as.bidCap / needed, 2), 0.05, 1);
            spend *= winRate;
          }
          const imps = spend / cpm * 1000;
          const ctr = BASE.ctr * (ad.hook || 1) * (ad.fit || 1) * e.fatigue * opt.ctr * noise();
          const clicks = sround(imps * ctr, r);
          const lpv = sround(clicks * (ad.pageLoad == null ? 0.78 : ad.pageLoad), r);
          const cvr = BASE.cvr * (ad.offer || 1) * (ad.lp || 1) * temp.cvr * opt.cvr * noise() * vol;
          const conv = sround(lpv * cvr, r);
          const viewX = attr.view ? sround(conv * 0.2 * (as.temperature === 'hot' ? 1.6 : 1), r) : 0;
          const engageX = attr.engage ? sround(conv * 0.05, r) : 0;
          const rep = sround(conv * tf, r) + (tf > 0 ? viewX + engageX : 0);
          const v3s = sround(imps * clamp(0.22 * (ad.hook || 1) * e.fatigue, 0.03, 0.75), r);
          const thru = sround(v3s * clamp(0.3 * (ad.hold || 1), 0.03, 0.9), r);
          const incremental = conv * temp.inc;
          st.cumImps += imps;
          const evForLearning = opt.evMult === 0 ? 0 : rep * opt.evMult;
          dayEvents += evForLearning;
          rows.push({
            day, campaignId: as.campaignId || 'c1', campaignName: as.campaignName || 'Campaign',
            adsetId: as.id, adsetName: as.name, adId: ad.id, adName: ad.name,
            spend, imps, clicks, lpv, conv, rep, viewX, engageX,
            repValue: rep * aov * valueMult, trueValue: conv * aov,
            v3s, thru, status, incremental, winRate,
            audienceSize: A, temperature: as.temperature || 'cold'
          });
        });
        st.events.push({ day, n: dayEvents });
        const ev7 = st.events.filter(x => x.day > day - 7 && x.day >= st.learnStart).reduce((a, x) => a + x.n, 0);
        if (!st.exited && ev7 >= 50) st.exited = true;
        void evCount;
      });
    }
    // Backend (Shopify/CRM-style truth) per day.
    const codShare = cfg.codShare == null ? 0.4 : cfg.codShare;
    const rto = cfg.rtoRate == null ? 0.2 : cfg.rtoRate;
    const backend = [];
    for (let d = 0; d < days; d++) {
      const dr = rows.filter(x => x.day === d);
      const orders = dr.reduce((a, x) => a + x.conv, 0);
      const cod = Math.round(orders * codShare);
      const cancelled = Math.round(cod * rto + (orders - cod) * 0.02);
      const utmTagged = track.utm === false ? 0 : Math.round(orders * 0.86);   // some sales are last-clicked elsewhere
      const spend = dr.reduce((a, x) => a + x.spend, 0);
      backend.push({ day: d, orders, cod, prepaid: orders - cod, cancelled, utmTagged, grossRevenue: orders * aov, netRevenue: (orders - cancelled) * aov, spend, incremental: dr.reduce((a, x) => a + x.incremental, 0) });
    }
    return { cfg, days, rows, backend, aov, trackingFactor: tf, startDate: cfg.startDate || '2026-10-01' };
  }

  /* ---------- Aggregation & reporting ---------- */
  function agg(rows, extra) {
    const s = { spend: 0, imps: 0, clicks: 0, lpv: 0, conv: 0, rep: 0, repValue: 0, trueValue: 0, v3s: 0, thru: 0, viewX: 0, incremental: 0 };
    rows.forEach(x => { Object.keys(s).forEach(k => { s[k] += x[k] || 0; }); });
    const A = extra && extra.audience ? extra.audience : null;
    const reach = A ? A * (1 - Math.exp(-s.imps / A)) : s.imps / 1.6;
    return Object.assign(s, {
      reach, freq: reach > 0 ? s.imps / reach : 0,
      cpm: s.imps ? s.spend / s.imps * 1000 : null,
      ctr: s.imps ? s.clicks / s.imps : null,
      cpc: s.clicks ? s.spend / s.clicks : null,
      cvr: s.lpv ? s.conv / s.lpv : null,
      cpr: s.rep ? s.spend / s.rep : null,
      roas: s.spend ? s.repValue / s.spend : null,
      trueRoas: s.spend ? s.trueValue / s.spend : null,
      hookRate: s.imps ? s.v3s / s.imps : null,
      holdRate: s.v3s ? s.thru / s.v3s : null
    });
  }

  /**
   * report(result, { level:'campaign'|'adset'|'ad', from, to, breakdown })
   * Returns rows keyed by entity (and segment, if a breakdown is chosen).
   */
  function report(res, opts) {
    opts = opts || {};
    const level = opts.level || 'adset';
    const from = opts.from == null ? 0 : opts.from;

/* ==========================================================================
   SANDBOX VALIDATOR
   Rates every graded field Best / Acceptable / Risky / Wrong with an expert
   comment, and produces the "what an expert would have built" comparison.
   A field can be rated in two ways:
     1. options carry their own rating:  { v, t, r:'B', why:'...' }

   ========================================================================== */

  'use strict';
  const C = MAG.core;

  function optionText(field, v) {
    if (!field.options) return v;

    return o ? o.t : v;
  }
  function displayValue(field, v) {
    if (field.display) return field.display(v);
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) return '(left blank)';
    if (Array.isArray(v)) return v.map(x => optionText(field, x)).join(', ');
    if (field.type === 'toggle') return v ? 'On' : 'Off';
    if (field.type === 'number') return (field.prefix || '') + C.fmt.num(Number(v)) + (field.suffix || '');
    return String(optionText(field, v));
  }
  function rateField(field, v, all) {
    if (typeof field.rate === 'function') {
      const res = field.rate(v, all || {});
      return { r: res.r, exp: res.exp || field.exp || '' };
    }
    if (field.options) {
      const o = field.options.find(x => String(x.v) === String(v));
      if (o && o.r) return { r: o.r, exp: o.why || field.exp || '' };
    }
    return { r: 'W', exp: field.exp || 'This field was left incomplete.' };
  }
  function expertText(field) {
    if (field.expertText) return field.expertText;
    if (field.expert != null) return displayValue(field, field.expert);
    const best = (field.options || []).filter(o => o.r === 'B').map(o => o.t);
    return best.length ? best.join(' / ') : '—';
  }

  /**
   * Validate a set of fields.
   * opts: { modId, ctx:'sandbox'|'lab', key } — logs competencies and decisions.
   */
  function run(fields, values, opts) {
    opts = opts || {};
    const items = fields.filter(f => f.graded !== false).map(f => {
      const v = values[f.key];
      const res = rateField(f, v, values);
      return { key: f.key, label: f.label, section: f.section, value: v, shown: displayValue(f, v), r: res.r, exp: res.exp, expert: expertText(f), comps: f.comps || [], security: !!f.security };
    });
    const max = items.length * 10;
    const pts = items.reduce((a, it) => a + C.RATINGS[it.r].pts, 0);
    const dist = { B: 0, A: 0, R: 0, W: 0 };
    items.forEach(it => { dist[it.r] += 1; });
    if (opts.log !== false) {
      items.forEach(it => {
        C.logComp(it.comps, opts.ctx || 'sandbox', C.RATINGS[it.r].ok);
        if (opts.modId) C.logDecision(opts.modId, { key: (opts.key || 'sb') + ':' + it.key, label: it.label, you: it.shown, expert: it.expert, r: it.r, exp: it.exp, kind: 'sandbox' });
      });
    }
    const okShare = items.length ? (dist.B + dist.A) / items.length : 0;
    return { items, pts, max, pct: max ? pts / max : 0, dist, okShare };
  }

</script>

  /* ---------- Build → simulator config ---------- */
  function ageShare(min, max) {
    const bands = [[18, 24, 0.25], [25, 34, 0.33], [35, 44, 0.2], [45, 54, 0.12], [55, 65, 0.1]];
    let s = 0;
    bands.forEach(b => { const lo = Math.max(b[0], min), hi = Math.min(b[1], max); if (hi >= lo) s += b[2] * (hi - lo + 1) / (b[1] - b[0] + 1); });
    return Math.max(0.03, s);
  }
  function toSimConfig(v, brief, seed) {
    const sim = brief.sim || {};
    const locs = v.s_locations && v.s_locations.length ? v.s_locations : ['IN'];
    const locShare = Math.min(1, locs.reduce((a, l) => a + ((LOCATIONS.find(x => x.v === l) || {}).share || 0.05), 0));
    let size = (sim.market || 350000000) * locShare * ageShare(Number(v.s_age_min || 18), Number(v.s_age_max || 65)) * (v.s_gender && v.s_gender !== 'all' ? 0.5 : 1);
    if (v.s_lang && v.s_lang.length && v.s_lang.indexOf('English (All)') < 0) size *= 0.25;
    const interests = v.s_interests || [];
    if (interests.length && !v.s_adv_aud) size *= Math.max(0.08, 0.35 - interests.length * 0.05);
    let temperature = 'cold';
    const inc = (v.s_custom_inc || []).map(id => CUSTOM.find(c => c.v === id)).filter(Boolean);
    if (inc.length && !v.s_adv_aud) {
      size = inc.reduce((a, c) => a + c.size, 0) * locShare;
      temperature = inc.some(c => c.temp === 'hot') ? 'hot' : inc.some(c => c.temp === 'warm') ? 'warm' : 'cold';
    }
    size = Math.max(3000, size);
    // Optimisation
    let optimisation = 'purchase';
    const goal = v.s_goal;
    if (goal === 'lpv') optimisation = 'lpv';
    else if (goal === 'link_clicks') optimisation = 'clicks';
    else if (goal === 'reach') optimisation = 'reach';
    else if (goal === 'leads' || goal === 'conversion_leads' || goal === 'conversations' || goal === 'calls') optimisation = 'lead';
    else if (v.s_event === 'AddToCart' || v.s_event === 'InitiateCheckout') optimisation = 'atc';
    else if (v.s_event === 'ViewContent' || v.s_event === 'PageView') optimisation = 'lpv';
    if (sim.objectiveFit && v.c_objective && sim.objectiveFit.indexOf(v.c_objective) < 0) optimisation = optimisation === 'purchase' ? 'lpv' : optimisation;
    // Placements
    let placements = 'advantage';
    if (v.s_place_mode === 'manual') {
      const pl = v.s_place_list || [];
      const vertical = pl.filter(p => /Reels|Stories/.test(p)).length;
      if (pl.length && pl.every(p => /Audience Network/.test(p) || pl.length <= 2) && pl.indexOf('Audience Network') >= 0) placements = 'an_heavy';
      else if (!vertical) placements = 'feeds_only';
      else placements = 'manual_broad';
    }
    // Creative modifiers
    const media = v.a_media || [];
    const verticalShown = placements !== 'feeds_only';
    let hookMod = 1, fitMod = 1;
    if (verticalShown && media.indexOf('9:16') < 0) hookMod *= 0.84;
    if (!media.length) hookMod *= 0.7;
    if (!v.a_primary || v.a_primary.trim().length < 15) hookMod *= 0.9;
    if (v.a_primary && v.a_primary.length > 450) hookMod *= 0.93;
    if (sim.goodCtas && v.a_cta && sim.goodCtas.indexOf(v.a_cta) < 0) fitMod *= 0.9;
    if (v.a_partner && sim.partnerBoost) hookMod *= sim.partnerBoost;
    // Tracking
    const dataset = v.s_dataset || '';
    const tracking = Object.assign({ pixel: true, capi: true, dedup: true, emq: 7.2, utm: true, value: true, currency: 'INR' }, sim.tracking || {});
    if (dataset === 'none' || (!v.a_track_web && ['website', 'website_app'].indexOf(v.s_convloc) >= 0)) { tracking.pixel = false; tracking.capi = false; }
    if (/Old agency/.test(dataset)) { tracking.capi = false; tracking.emq = 4.5; }
    tracking.utm = !!(v.a_utm && v.a_utm.source && v.a_utm.campaign);
    const attribution = v.s_attr === '1c' || v.s_attr === '7c' ? { view: false, engage: false } : { view: true, engage: true };
    // Budget & bidding
    const budget = Number(v.c_cbo ? v.c_budget : v.s_budget) || 0;
    let bidMult = 1, bidCap = null;
    if (v.s_bid === 'cpr_goal') bidMult = 0.96;
    if (v.s_bid === 'roas_goal') bidMult = 0.9;
    if (v.s_bid === 'bid_cap') bidCap = Number(v.s_bid_value) || (sim.targetCpa || 500) * 0.5;
    const ads = (sim.ads || [{ id: 'ad1', name: 'Creative A', hook: 1, fit: 1, quality: 0.6 }]).map(a => Object.assign({}, a, { hook: (a.hook || 1) * hookMod, fit: (a.fit || 1) * fitMod, name: (v.a_name || 'Ad') + ' · ' + a.name }));
    return {
      seed: seed || ('lab:' + brief.id), days: 14, startDate: sim.startDate || '2026-10-01', season: sim.season,
      aov: sim.aov || 1200, codShare: sim.codShare, rtoRate: sim.rtoRate, tracking, attribution,
      adsets: [{ id: 'as1', name: v.s_name || 'Ad set', campaignId: 'c1', campaignName: v.c_name || 'Campaign', dailyBudget: budget, audienceSize: size, temperature, bidMult, bidCap, placements, optimisation, ads }]
    };
  }

  const wireBrief = {

  const scen1 = {
    id: 'm2c1', title: '"Your agency is lying"', minutes: 7,

          { t: 'The whole gap is attribution windows.', r: 'A', exp: 'Leaves out the 22 double counts, the biggest single cause.', next: 'n4' },

          { t: 'Share the bridge. Own the dedup bug: it inflated reported purchases by 22, and it will be fixed and verified in Test Events within 48 hours. From now on, Meta numbers guide optimisation and Shopify is the business truth. Every Monday you get a reconciliation sheet.', r: 'B', exp: 'Honest, specific, with a fix, a date and a habit. This is what keeps clients for years.', next: 'n5', set: { honest: true } },
          { t: 'Share the bridge and fix the bug; mention the bug briefly at the end.', r: 'A', exp: 'Factually fine, but burying your own mistake reads as evasive if he notices.', next: 'n5' },
          { t: 'Fix the bug quietly and explain only attribution windows.', r: 'R', exp: 'Hiding your error is dishonest by omission. If he finds out, the account is gone.', next: 'n5' },

          { t: 'Switch live ad sets to 1-day click mid-campaign so numbers look closer.', r: 'R', exp: 'It changes what the system optimises for and can disrupt learning, just to make a report look tidier.', next: 'n6', set: { switched: true } }
        ]

<script data-src="src/ui/drill.js">
/* ==========================================================================

/* ==========================================================================
   MODULE RUNNER — Brief → Drill → Sandbox → Scenario → Debrief.

   ========================================================================== */

  function settings(root) {

    const sel = h('select.input', { id: 'set-theme', style: { maxWidth: '220px' } }, [['dark', 'Dark (default)'], ['light', 'Light'], ['system', 'Match my device']].map(o => h('option', { value: o[0] }, o[1])));
    sel.value = s.theme;
    sel.addEventListener('change', () => { s.theme = sel.value; C.persist(); MAG.app.applySettings(); });
    const tog = (key, label, d) => { const i = h('input', { type: 'checkbox', id: 'set-' + key, role: 'switch' }); i.checked = !!s[key]; i.addEventListener('change', () => { s[key] = i.checked; C.persist(); MAG.app.applySettings(); }); return h('label.toggle', { for: 'set-' + key }, i, h('span', h('b', label), d ? h('span.faint', ' — ' + d) : null)); };
    const fileIn = h('input', { type: 'file', id: 'imp-file', accept: '.json,application/json' });
    fileIn.addEventListener('change', () => {
      const f = fileIn.files && fileIn.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => doImport(String(rd.result));
      rd.readAsText(f);
    });
    const paste = h('textarea.input.mono', { id: 'imp-paste', rows: 3, placeholder: 'Or paste exported JSON here', style: { fontSize: '0.78rem' } });
    const resetBox = h('div.stack');
    function doImport(txt) {
      try { C.importJSON(txt); toast('Progress imported'); MAG.app.applySettings(); MAG.app.go('home'); }
      catch (e) { toast(e.message || 'That file could not be read.'); }
    }
    root.appendChild(h('div.stack-l', { style: { maxWidth: '820px' } },
      h('div.stack', h('span.eyebrow', 'Settings'), h('h2', 'Settings & progress')),
      h('div.panel.stack', h('h4', 'Display & sound'),
        h('div.field', h('label', { for: 'set-theme' }, 'Theme'), sel),
        tog('reducedMotion', 'Reduce motion', 'also respects your device setting'),
        tog('sound', 'Sound effects', 'off by default'),
        tog('unlockAll', 'Unlock all stages and modules', 'for reviewers and trainers')),
      h('div.panel.stack', h('h4', 'Move progress to another device'),
        h('p.small.muted', 'Progress saves automatically in this browser. Export it as a file to continue elsewhere.'),
        h('div.row', h('button.btn', { type: 'button', onclick: () => offerFile('auction-room-progress.json', C.exportJSON()) }, 'Export progress (.json)'),
          h('button.btn', { type: 'button', onclick: () => copyText(C.exportJSON()) }, 'Copy progress JSON')),
        h('div.field', h('label', { for: 'imp-file' }, 'Import from file'), fileIn),
        h('div.field', paste, h('div.row', h('button.btn.small', { type: 'button', onclick: () => paste.value.trim() && doImport(paste.value) }, 'Import pasted JSON')))),
      h('div.panel.stack', h('h4', 'Reset'), h('p.small.muted', 'Deletes all progress, notes and badges in this browser.'), resetBox),
      h('div.panel.stack', h('h4', 'Meta facts used in this game'),
        h('p.small.muted', 'Meta changes names, defaults and thresholds often. Every fact the game relies on is listed with the date it was last checked. Recheck against Meta\'s official Help Centre before relying on one at work.'),
        h('div.table-wrap', h('table.data', h('thead', h('tr', h('th', 'Fact'), h('th', 'What the game says'), h('th', 'Last verified'))),
          h('tbody', Object.keys(MAG.VOLATILE_FACTS).map(k => { const f = MAG.VOLATILE_FACTS[k]; return h('tr', h('td.mono.small', k), h('td', { style: { whiteSpace: 'normal', minWidth: '300px' } }, f.value, h('div.small.faint', f.note)), h('td.small', f.lastVerified)); }))))),
      h('div.panel.stack', h('h4', 'Keyboard shortcuts'), shortcutList())));
    paintReset();
    function paintReset() {
      resetBox.innerHTML = '';
      resetBox.appendChild(h('button.btn', { type: 'button', onclick: () => {
        resetBox.innerHTML = '';
        const inp = h('input.input', { id: 'reset-confirm', placeholder: 'Type RESET', style: { maxWidth: '200px' } });
        resetBox.appendChild(h('div.row', inp, h('button.btn', { type: 'button', style: { color: 'var(--wrong)' }, onclick: () => { if (inp.value.trim().toUpperCase() === 'RESET') { C.reset(); toast('Progress reset'); MAG.app.applySettings(); MAG.app.go('home'); } else toast('Type RESET to confirm'); } }, 'Delete all progress'), h('button.btn.ghost', { type: 'button', onclick: paintReset }, 'Cancel')));
        inp.focus();
      } }, 'Reset progress…'));
    }
  }
  function shortcutList() {
    return h('div.table-wrap', h('table.data', h('tbody',
      [['1 – 4', 'Pick an option'], ['← / →', 'Swipe left or right'], ['Enter', 'Continue / next'], ['G', 'Go to the module map'], ['L', 'Open the Lab'], ['?', 'Show shortcuts'], ['Esc', 'Close a dialog']].map(r => h('tr', h('td', h('span.kbd', r[0])), h('td', r[1]))))));
  }

  /* ================= Rapid Recall ================= */
  function recall(root) {
    const all = MAG.Drill.allItems();
    const due = C.dueReviews().map(r => all[r.id]).filter(Boolean).slice(0, 10);
    if (!due.length) { root.appendChild(h('div.panel.stack', h('h3', 'Nothing due'), h('p.muted', 'Missed drill items come back here after 1, 3 and 7 sessions.'), h('div.row', h('button.btn.primary', { type: 'button', onclick: () => MAG.app.go('home') }, 'Back to map')))); return; }
    root.appendChild(h('div.stack', { style: { maxWidth: '760px', margin: '0 auto 16px' } }, h('span.eyebrow', 'Rapid Recall · 2 minutes'), h('p.muted', 'Items you missed before. Answer correctly to push them further out; miss again and they come back next session.')));
    const box = h('div');
    root.appendChild(box);
    MAG.Drill.run(box, C.shuffle(due), { ctx: 'review', title: 'Rapid Recall', totalSeconds: 120, onDone: () => MAG.app.go('home'), doneLabel: 'Back to map' });
  }

  MAG.Screens = { home, lab, profile, playbook, settings, recall, shortcutList, moduleUnlocked, nextStep };
  void md; void modal; void closeModal;
})(window.MAG);
</script>
<script data-src="src/ui/app.js">
/* ==========================================================================
   APP — boot, HUD, router, keyboard shortcuts, settings, session nudges.
   ========================================================================== */
(function (MAG) {
  'use strict';
  const { h, toast, modal, closeModal, modalOpen } = MAG.ui;
  const C = MAG.core;

  let route = 'home', params = {}, focusMod = null;
  let hud, main;

  function applySettings() {
    const s = C.state.settings;
    const root = document.documentElement;
    if (s.theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', s.theme || 'dark');
    root.classList.toggle('reduce-motion', !!s.reducedMotion);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) s.reducedMotion = s.reducedMotion || false;
    paintHud();
  }

  /* ---------- HUD ---------- */
  function paintHud() {
    if (!hud) return;
    const st = C.state;
    const rk = C.rankFor(st.xp);
    const t = st.trust;
    const focusComp = focusMod ? focusMod.comps.find(c => C.compStatus(c) !== 'proven') : null;
    const due = C.dueReviews().length;
    hud.innerHTML = '';
    const navBtn = (r, label) => h('button.btn.ghost', { type: 'button', 'aria-current': route === r ? 'page' : null, onclick: () => go(r) }, label);
    hud.appendChild(h('div.hud-inner',
      h('button.brand', { type: 'button', onclick: () => go('home'), 'aria-label': 'Auction Room home' }, h('span.brand-mark', { 'aria-hidden': 'true' }, '₹'), 'Auction Room'),
      h('div.hud-stats',
        h('div.hud-stat', h('span.eyebrow', 'Rank'), h('span.hud-val', rk.name),
          h('div.meter', { role: 'progressbar', 'aria-label': 'XP to next rank', 'aria-valuenow': Math.round(rk.pct * 100), 'aria-valuemin': '0', 'aria-valuemax': '100' }, h('i', { style: { width: (rk.pct * 100) + '%' } }))),
        h('div.hud-stat', h('span.eyebrow', 'XP'), h('span.hud-val.mono', C.fmt.num(st.xp))),
        h('div.hud-stat', h('span.eyebrow', 'Client trust'), h('span.hud-val.mono', t + '/100'),
          h('div.meter.trust' + (t < 25 ? '.low' : t < 50 ? '.mid' : ''), { role: 'progressbar', 'aria-label': 'Client trust', 'aria-valuenow': t, 'aria-valuemin': '0', 'aria-valuemax': '100' }, h('i', { style: { width: t + '%' } }))),
        h('div.hud-stat.focus-chip', h('span.eyebrow', 'Competency focus'), h('span.hud-val', { title: focusComp ? MAG.comp(focusComp).label : '' }, focusComp ? MAG.comp(focusComp).label : focusMod ? 'All proven here' : 'Pick a module'))),
      h('nav.hud-nav', { 'aria-label': 'Main' },
        navBtn('home', 'Map'), navBtn('lab', 'Lab'), navBtn('playbook', 'Playbook'), navBtn('profile', 'Profile'),
        due ? h('button.btn.ghost', { type: 'button', 'aria-current': route === 'recall' ? 'page' : null, onclick: () => go('recall') }, 'Recall (' + due + ')') : null,
        navBtn('settings', 'Settings'))));
  }
  function setFocus(mod) { focusMod = mod; paintHud(); }

  /* ---------- Router ---------- */
  function go(r, p) {
    route = r; params = p || {};
    if (r !== 'module') focusMod = null;
    main.innerHTML = '';
    paintHud();
    try {
      if (r === 'module') MAG.Runner.open(main, params.id, params.stage, params.sub);
      else (MAG.Screens[r] || MAG.Screens.home)(main, params);
    } catch (e) {
      main.innerHTML = '';
      main.appendChild(h('div.panel.stack', h('h3', 'Something went wrong on this screen'), h('p.muted', String(e && e.message || e)), h('button.btn.primary', { type: 'button', onclick: () => go('home') }, 'Back to map')));
      if (window.console) console.warn(e);
    }
    window.scrollTo(0, 0);
  }

  /* ---------- Keyboard ---------- */
  function onKey(e) {
    C.touch();
    const tag = (e.target && e.target.tagName) || '';
    const typing = /INPUT|TEXTAREA|SELECT/.test(tag) && e.target.type !== 'checkbox' && e.target.type !== 'radio';
    if (e.key === 'Escape' && modalOpen()) { closeModal(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const scope = modalOpen() ? document.querySelector('.modal') : main;
    if (/^[1-9]$/.test(e.key)) {
      const all = Array.from(scope.querySelectorAll('[data-key-n="' + e.key + '"]')).filter(b => !b.disabled && b.offsetParent !== null);
      const b = all[all.length - 1];
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const b = scope.querySelector('[data-swipe="' + (e.key === 'ArrowLeft' ? 'left' : 'right') + '"]:not([disabled])');
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
    if (e.key === 'Enter') {
      if (tag === 'BUTTON' || tag === 'A') return; // native activation
      const all = Array.from(scope.querySelectorAll('[data-enter]')).filter(b => !b.disabled && b.offsetParent !== null);
      const b = all[all.length - 1];
      if (b) { e.preventDefault(); b.click(); }
      return;
    }
    if (modalOpen()) return;
    if (e.key === '?') { modal([h('h3', 'Keyboard shortcuts'), MAG.Screens.shortcutList(), h('div.row', h('button.btn.primary', { type: 'button', onclick: closeModal }, 'Close'))], { label: 'Shortcuts' }); return; }
    if (e.key === 'g' || e.key === 'G') go('home');
    if (e.key === 'l' || e.key === 'L') go('lab');
  }

  /* ---------- Boot ---------- */
  function boot() {
    C.init();
    const app = h('div.app');
    hud = h('header.hud');
    main = h('main.view', { id: 'main', tabindex: '-1' });
    app.appendChild(hud); app.appendChild(main);
    document.body.appendChild(app);
    applySettings();

    C.bus.on('xp', ev => { if (ev.n >= 40 && ev.why !== 'Competency proven' && ev.why !== 'Badge') toast('+' + ev.n + ' XP · ' + ev.why, 'xp'); paintHud(); });
    C.bus.on('rankup', rk => toast('Promoted to ' + rk.name + '!', 'badge'));
    C.bus.on('badge', b => toast('Badge earned: ' + b.name, 'badge'));
    C.bus.on('proven', id => toast('Competency proven: ' + MAG.comp(id).label, 'badge'));
    C.bus.on('trust', paintHud);
    C.bus.on('reset', () => { applySettings(); });
    C.bus.on('nudge', () => toast('You have been playing for a while. A five-minute break helps it stick. Progress is saved.'));

    ['pointerdown', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, C.touch, { passive: true }));
    document.addEventListener('keydown', onKey);
    setInterval(() => C.tickActivity(15000), 15000);

    go('home');
    // Each session starts with Rapid Recall when items are due.
    const due = C.dueReviews().length;
    if (due) {
      modal([h('span.eyebrow', 'New session'), h('h3', 'Rapid Recall: ' + due + ' item' + (due > 1 ? 's' : '') + ' due'),
        h('p.muted', 'Two minutes on things you missed before. It is the fastest way to make them stick.'),
        h('div.row', h('button.btn.primary', { type: 'button', onclick: () => { closeModal(); go('recall'); } }, 'Start Rapid Recall'), h('button.btn', { type: 'button', onclick: closeModal }, 'Later'))], { label: 'Rapid Recall' });
    }
  }

  MAG.app = { go, setFocus, applySettings, paintHud, boot };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})(window.MAG);
</script>
